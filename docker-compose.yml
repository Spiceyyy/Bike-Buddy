services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  graphhopper:
    build: ./graphhopper
    environment:
      OSM_EXTRACT_URL: ${OSM_EXTRACT_URL:?copy .env.example to .env}
      JAVA_OPTS: ${GRAPHHOPPER_JAVA_OPTS:--Xmx2g}
    ports:
      - "127.0.0.1:8989:8989"
    volumes:
      - graphhopper-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8989/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      # The first start downloads the extract and builds the routing graph.
      start_period: 15m
      start_interval: 5s

  backend:
    build: ./backend
    command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GRAPHHOPPER_URL: http://graphhopper:8989
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      # Lets evals/run_evals.py import the backend's code.
      PYTHONPATH: /app
      # Windows bind mounts do not deliver file-change events to containers.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - ./evals:/evals
    depends_on:
      postgres:
        condition: service_healthy
      graphhopper:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_MAP_CENTER: ${MAP_CENTER:--73.6,45.52}
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres-data:
  graphhopper-data:
